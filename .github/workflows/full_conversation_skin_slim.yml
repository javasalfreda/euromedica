name: Full Conversation SKIN SLIM to BigQuery ETL

on:
  schedule:
    # Berjalan harian jam 22:00 UTC (05:00 WIB)
    # Dibedakan dari workflow utama (19:37 & 19:39 UTC) agar tidak membebani
    - cron: '0 22 * * *'

  workflow_dispatch:

jobs:
  run-full-conversation-skin-slim:
    runs-on: ubuntu-24.04

    env:
      CEKAT_API_KEY: ${{ secrets.CEKAT_API_KEY }}

    steps:
      # 1. Checkout kode dari repositori
      - name: Checkout Repository Kode
        uses: actions/checkout@v7

      # 2. Setup Python environment
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 3. Install semua dependensi library
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow python-dateutil google-cloud-bigquery numpy

      # 4. Melakukan autentikasi ke Google Cloud menggunakan Secret
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 5. Jalankan ETL Full Conversation SKIN SLIM
      - name: Run Full Conversation SKIN SLIM Script
        run: python full_conversation_skin_slim.py
