name: "🛠️ Manual ETL Re-run Control Panel"

on:
  workflow_dispatch:
    inputs:
      etl_script:
        description: 'Pilih script ETL yang ingin dijalankan ulang:'
        required: true
        type: choice
        default: 'Pilih salah satu...'
        options:
          - 'etl_boards_tracker_skin_slim.py'
          - 'etl_all_boards_cekat.py'
          - 'etl_boards_calendar_cekat.py'
          - 'etl_dim_customer.py'
          - 'etl_fact_transaction.py'
          - 'Jalankan Semua Script Cekat AI'

jobs:
  manual-execution:
    runs-on: ubuntu-latest

    steps:
    # 1. Setup standar (Hanya jalan sekali di awal)
    - name: Checkout Repository Kode
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas pyarrow python-dateutil google-cloud-bigquery numpy

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 2. LOGIKA KONDISIONAL (Hanya mengeksekusi script yang dipilih user)
    
    - name: Jalankan Boards Tracker
      if: github.event.inputs.etl_script == 'etl_boards_tracker_skin_slim.py' || github.event.inputs.etl_script == 'Jalankan Semua Script Cekat AI'
      run: python etl_boards_tracker_skin_slim.py

    - name: Jalankan All Boards Cekat
      if: github.event.inputs.etl_script == 'etl_all_boards_cekat.py' || github.event.inputs.etl_script == 'Jalankan Semua Script Cekat AI'
      run: python etl_all_boards_cekat.py

    - name: Jalankan Boards Calendar
      if: github.event.inputs.etl_script == 'etl_boards_calendar_cekat.py' || github.event.inputs.etl_script == 'Jalankan Semua Script Cekat AI'
      run: python etl_boards_calendar_cekat.py

    - name: Jalankan Dim Customer
      if: github.event.inputs.etl_script == 'etl_dim_customer.py'
      run: python etl_dim_customer.py

    - name: Jalankan Fact Transaction
      if: github.event.inputs.etl_script == 'etl_fact_transaction.py'
      run: python etl_fact_transaction.py
