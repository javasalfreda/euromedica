name: Cekat AI to BigQuery ETL

on:
  schedule:
    # Berjalan harian setiap jam 23:00 UTC (06:00 WIB)
    - cron: '0 23 * * *'
  workflow_dispatch: # Supaya bisa di-klik manual untuk testing

jobs:
  run-cekat-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout kode dari repositori
    - name: Checkout Repository Kode
      uses: actions/checkout@v4

    # 2. Setup Python environment (Sudah fix tanpa warning)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install semua dependensi library
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas pyarrow python-dateutil google-cloud-bigquery

    # 4. Melakukan autentikasi ke Google Cloud menggunakan Secret (Sudah fix syntax)
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 5. Jalankan ETL Cekat Pertama: Boards Tracker Skin & Slim
    - name: Run Cekat Boards Tracker Script
      run: python etl_boards_tracker_skin_slim.py

    # 6. Jalankan ETL Cekat Kedua: All Boards Cekat (Dinamis Exclude)
    - name: Run All Boards Cekat Script
      run: python etl_all_boards_cekat.py
